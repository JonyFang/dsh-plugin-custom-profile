<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile</title>
<script>
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get("theme") === "light" ? "light" : "dark";
  document.documentElement.dataset.lang = params.get("lang") === "zh" ? "zh" : "en";
  if (params.get("shot") === "1") document.documentElement.dataset.shot = "1";
</script>
<style>
  :root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    --bg: #151517;
    --text: #f9fafb;
    --muted: #cfd3d6;
    --border: #fff3;
    --soft: #ffffff14;
    --hover: #ffffff14;
    --primary: #f9fafb;
    --on-primary: #151517;
    --focus: #8eafff;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fff;
    --text: #0f1115;
    --muted: #61666b;
    --border: #00000029;
    --soft: #0000000a;
    --hover: #00000014;
    --primary: #0f1115;
    --on-primary: #fff;
    --focus: #385fd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button, input { font: inherit; }
  button { cursor: pointer; border: 0; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bar { height: 52px; padding: 0 28px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .bar a { color: var(--text); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .bar a[aria-current="true"] { background: var(--soft); }
  :root[data-shot="1"] .bar { display: none; }
  main { width: min(100% - 80px, 680px); margin: 28px auto 48px; }
  h1 { margin: 0 0 10px; font-size: 22px; line-height: 28px; font-weight: 600; }
  .intro { margin: 0; font-size: 14px; line-height: 22px; color: var(--muted); }
  .avatar-field { margin-top: 30px; }
  .field-label { font-size: 14px; line-height: 20px; font-weight: 500; }
  .avatar-row { display: flex; align-items: center; gap: 20px; margin-top: 12px; }
  .avatar { width: 76px; height: 76px; flex: none; border-radius: 50%; background: var(--soft); display: grid; place-items: center; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0); }
  :root[data-theme="dark"] .avatar img { filter: brightness(0) invert(1); }
  .change { min-height: 40px; padding: 9px 18px; border-radius: 12px; background: var(--soft); color: var(--text); font-size: 14px; font-weight: 500; }
  .help { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 19px; }
  .name-field { display: block; margin-top: 28px; padding: 15px 18px 13px; border: 1px solid var(--border); border-radius: 16px; }
  .name-field span { display: block; font-size: 13px; line-height: 18px; font-weight: 500; }
  .name-field input { display: block; width: 100%; margin-top: 9px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 20px; line-height: 28px; }
  .name-help { margin-top: 10px; }
  .status { margin: 12px 0 0; min-height: 19px; color: var(--muted); font-size: 12px; line-height: 19px; }
  footer { display: flex; align-items: center; gap: 12px; margin-top: 30px; }
  .action { min-height: 38px; padding: 8px 14px; border-radius: 10px; background: transparent; color: var(--text); font-size: 14px; }
  .action:disabled { opacity: .4; cursor: default; }
  .reset { margin-left: -14px; }
  .spacer { flex: 1; }
  .save { min-width: 70px; background: var(--primary); color: var(--on-primary); font-weight: 500; }
  .save:disabled { background: var(--soft); color: var(--text); opacity: 1; }
  @media (max-width: 600px) { main { width: calc(100% - 40px); } }
</style>
</head>
<body>
<div class="bar">
  <a id="en" href="?lang=en">English</a>
  <a id="zh" href="?lang=zh">中文</a>
  <a id="light" href="?theme=light">Light</a>
  <a id="dark" href="?theme=dark">Dark</a>
</div>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <section class="avatar-field">
    <div class="field-label" id="avatar-label"></div>
    <div class="avatar-row">
      <div class="avatar" role="img"><img src="../icon.svg" alt=""></div>
      <button class="change" type="button" id="change"></button>
    </div>
    <p class="help" id="avatar-hint"></p>
  </section>
  <label class="name-field"><span id="name-label"></span><input id="name" readonly tabindex="-1"></label>
  <p class="help name-help" id="name-hint"></p>
  <p class="status" id="status"></p>
  <footer>
    <button class="action reset" type="button" id="reset"></button>
    <span class="spacer"></span>
    <button class="action" type="button" id="cancel"></button>
    <button class="action save" type="button" id="save" disabled></button>
  </footer>
</main>
<script>
  const copy = {
    en: {
      title: "Profile",
      intro: "Changes the name and avatar shown in this device's sidebar. Your account is not modified or synced.",
      avatar: "Avatar",
      change: "Change",
      avatarHint: "PNG, JPG, WebP, GIF or AVIF, up to 10 MB. Cropped square and resized to 128×128.",
      name: "Display name",
      value: "Jony",
      nameHint: "Save an empty value to show the account name again. Applied to the sidebar only while signed in.",
      reset: "Reset",
      cancel: "Cancel",
      save: "Save",
      saved: "Saved"
    },
    zh: {
      title: "个人资料",
      intro: "只改这台设备上左下角的显示名称和头像，不会修改或同步账号资料。",
      avatar: "头像",
      change: "更换",
      avatarHint: "PNG / JPG / WebP / GIF / AVIF，最大 10 MB；自动居中裁成正方形并缩小到 128×128。",
      name: "显示名称",
      value: "强尼",
      nameHint: "留空保存即恢复账号原名。仅在登录状态下替换左下角显示。",
      reset: "恢复默认",
      cancel: "取消",
      save: "保存",
      saved: "已保存"
    }
  };
  const root = document.documentElement;
  const lang = root.dataset.lang;
  const theme = root.dataset.theme;
  const text = copy[lang];
  root.lang = lang === "zh" ? "zh-CN" : "en";
  const keep = new URLSearchParams({ lang, theme });
  if (root.dataset.shot === "1") keep.set("shot", "1");
  function href(next) {
    const query = new URLSearchParams(keep);
    Object.entries(next).forEach(([key, value]) => query.set(key, value));
    return "?" + query.toString();
  }
  document.getElementById("en").href = href({ lang: "en" });
  document.getElementById("zh").href = href({ lang: "zh" });
  document.getElementById("light").href = href({ theme: "light" });
  document.getElementById("dark").href = href({ theme: "dark" });
  document.getElementById(lang).setAttribute("aria-current", "true");
  document.getElementById(theme).setAttribute("aria-current", "true");
  document.getElementById("title").textContent = text.title;
  document.getElementById("intro").textContent = text.intro;
  document.getElementById("avatar-label").textContent = text.avatar;
  document.getElementById("change").textContent = text.change;
  document.getElementById("avatar-hint").textContent = text.avatarHint;
  document.getElementById("name-label").textContent = text.name;
  document.getElementById("name").value = text.value;
  document.getElementById("name-hint").textContent = text.nameHint;
  document.getElementById("reset").textContent = text.reset;
  document.getElementById("cancel").textContent = text.cancel;
  document.getElementById("save").textContent = text.save;
  document.getElementById("status").textContent = text.saved;
</script>
</body>
</html>
