name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install and test
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Check the tag against package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag $TAG does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Publish the npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "dsh-plugin-custom-profile@$version" version >/dev/null 2>&1; then
            echo "Version $version is already on npm."
            exit 0
          fi
          # npm rejects a prerelease version without an explicit tag. latest
          # keeps `npm install dsh-plugin-custom-profile` and the plugin
          # market on the version this tag names.
          npm publish --tag latest

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const version = process.env.TAG.slice(1);
            writeFileSync(process.env.RUNNER_TEMP + "/notes.md", [
              "Plugin version `" + version + "`. The tag was pushed on the default branch after the compatibility pull request merged.",
              "",
              "---",
              "",
              "插件版本 `" + version + "`。兼容性 pull request 合进默认分支之后，推送了这个 tag。"
            ].join("\n") + "\n");
          '
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
